name: Release new Docker image

on:
  workflow_dispatch:
    inputs:
      swark_version:
        description: 'Version of swark/swark Docker image to release'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: swiss-architecture-knife/swark

jobs:
  release:
    runs-on: ubuntu-24.04

    name: Release official Docker image for ${{ inputs.swark_version }}
    
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove optional "v" prefix
        id: version
        run: |
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.swark_version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image building
        id: build
        run: |
          make VERSION=${VERSION} prepare
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.build.outputs.sanitized_version }}
            type=raw,value=${{ steps.build.outputs.release_version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: "./${{ steps.build.outputs.build_directory }}" 
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SWARK_VERSION=${{ steps.version.outputs.version }}
            RELEASE_FILE=${{ steps.build.outputs.release_file }}
